    name: complaint-app-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DB_HOST
        value: mysql-1e808172-haleemajabar792-8c47.e.aivencloud.com
      - key: DB_PORT
